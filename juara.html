<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Juara</title>
  <meta name="description" content="Papan juara permainan ular tangga matematika: podium, peringkat akhir, dan waktu bermain.">
  <link rel="icon" href="asset/logo.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/juara.css">
</head>
<body>
  <!-- Kepingan warna yang jatuh; dibuat oleh JS -->
  <div class="konfeti" id="konfeti" aria-hidden="true"></div>

  <main class="juara-page" id="juaraPage">
    <!-- Diisi oleh JS dari data yang dikirim halaman permainan -->
  </main>

  <script src="js/suara.js"></script>

  <script>
    /* =========================================================
       PAPAN JUARA
       Halaman ini menggantikan pop up juara yang dulu muncul di
       atas papan. Data hasil permainan dikirim lewat alamat:
         juara.html#<JSON hasil>
       Cara ini dipilih karena situsnya dibuka langsung dari berkas
       (file://) tanpa server, jadi tidak bisa mengandalkan
       penyimpanan peramban yang kadang diblokir.
       ========================================================= */

    const PIALA =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"' +
      ' stroke-linecap="round" stroke-linejoin="round">' +
      '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4Z"/>' +
      '<path d="M17 5h2.5a1.5 1.5 0 0 1 0 5H17M7 5H4.5a1.5 1.5 0 0 0 0 5H7"/></svg>';

    const MEDALI = ["🥇", "🥈", "🥉"];

    function bacaHasil() {
      try {
        const mentah = decodeURIComponent(location.hash.replace(/^#/, ""));
        if (!mentah) return null;
        const d = JSON.parse(mentah);
        if (!d || !Array.isArray(d.ranked) || !d.ranked.length) return null;
        return d;
      } catch (e) {
        return null;
      }
    }

    function aman(teks) {
      return String(teks == null ? "" : teks).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }

    /* Ikon hewan diambil dari alamat luar (img.icons8.com). Kalau gagal
       dimuat — misalnya dipakai di kelas tanpa internet — kotaknya diganti
       huruf awal nama pemain, jadi tetap kebaca dan bukan gambar rusak.
       Penanganannya dipasang lewat pasangIkonCadangan() setelah render. */
    function gambarPemain(p, kelas) {
      const nama = aman(p.label);
      if (!p.icon) {
        return '<span class="' + kelas + ' ikon-huruf">' + nama.charAt(0) + "</span>";
      }
      return (
        '<img class="' + kelas + '" src="' + aman(p.icon) +
        '" alt="" data-awal="' + nama.charAt(0) + '" draggable="false">'
      );
    }

    function pasangIkonCadangan(wadah) {
      wadah.querySelectorAll("img[data-awal]").forEach(function (img) {
        const ganti = function () {
          const s = document.createElement("span");
          s.className = img.className + " ikon-huruf";
          s.textContent = img.dataset.awal;
          if (img.parentNode) img.replaceWith(s);
        };
        img.addEventListener("error", ganti);
        // sudah gagal sebelum penangan terpasang
        if (img.complete && img.naturalWidth === 0) ganti();
      });
    }

    function render() {
      const d = bacaHasil();
      const wadah = document.getElementById("juaraPage");

      if (!d) {
        wadah.innerHTML =
          '<div class="kartu-kosong">' +
          '<div class="piala-kosong">' + PIALA + "</div>" +
          "<h1>Belum ada hasil permainan</h1>" +
          "<p>Papan juara muncul setelah satu permainan selesai. Yuk main dulu!</p>" +
          '<div class="tombol-baris">' +
          '<a class="tombol utama" href="ulartangga.html">Main Ular Tangga</a>' +
          '<a class="tombol" href="index.html">Beranda</a>' +
          "</div></div>";
        document.body.classList.add("siap");
        return;
      }

      const ranked = d.ranked;
      const juara = ranked[0];
      const petakAkhir = d.endCell || 46;

      /* --- podium: urutan tampil 2 - 1 - 3 supaya juara di tengah --- */
      const urut = ranked.length >= 3 ? [1, 0, 2] : (ranked.length === 2 ? [1, 0] : [0]);
      let podium = "";
      urut.forEach(function (i) {
        const p = ranked[i];
        if (!p) return;
        const peringkat = i + 1;
        podium +=
          '<div class="slot peringkat-' + peringkat + '">' +
          '<div class="slot-pemain">' +
          '<span class="medali">' + (MEDALI[i] || "") + "</span>" +
          gambarPemain(p, "slot-ikon") +
          '<span class="slot-nama">' + aman(p.label) + "</span>" +
          '<span class="slot-posisi">Petak ' + aman(p.pos) + "</span>" +
          "</div>" +
          '<div class="blok"><span class="angka">' + peringkat + "</span></div>" +
          "</div>";
      });

      /* --- daftar peringkat lengkap, dengan bilah kemajuan --- */
      let daftar = "";
      ranked.forEach(function (p, i) {
        const persen = Math.max(4, Math.round((p.pos / petakAkhir) * 100));
        daftar +=
          '<li class="baris' + (i === 0 ? " baris-juara" : "") + '">' +
          '<span class="urutan">' + (i + 1) + "</span>" +
          gambarPemain(p, "baris-ikon") +
          '<span class="baris-nama">' + aman(p.label) + "</span>" +
          '<span class="bilah"><span class="bilah-isi" style="width:' + persen + '%"></span></span>' +
          '<span class="baris-petak">Petak ' + aman(p.pos) + "</span>" +
          "</li>";
      });

      const judul = d.timeUp
        ? "Waktu Habis!"
        : "Selamat, " + aman(juara.label) + "!";
      const anak = d.timeUp
        ? aman(juara.label) + " paling dekat ke petak terakhir."
        : "Berhasil sampai petak " + aman(juara.pos) + " lebih dulu.";

      wadah.innerHTML =
        '<a class="tombol-beranda" href="index.html" aria-label="Ke beranda">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3L12 3Z"/></svg>' +
        "</a>" +

        '<header class="kepala">' +
        '<div class="piala">' + PIALA + "</div>" +
        '<p class="label-atas">Papan Juara</p>' +
        "<h1>" + judul + "</h1>" +
        '<p class="anak-judul">' + anak + "</p>" +
        (d.waktu ? '<p class="waktu">Waktu bermain: <strong>' + aman(d.waktu) + "</strong></p>" : "") +
        "</header>" +

        '<section class="podium" aria-label="Podium tiga besar">' + podium + "</section>" +

        '<section class="panel-daftar">' +
        "<h2>Peringkat Akhir</h2>" +
        '<ol class="daftar">' + daftar + "</ol>" +
        "</section>" +

        '<div class="tombol-baris">' +
        '<a class="tombol utama" href="ulartangga.html">Main Lagi</a>' +
        '<a class="tombol" href="index.html">Beranda</a>' +
        "</div>";

      pasangIkonCadangan(wadah);
      document.body.classList.add("siap");
      if (!d.timeUp) {
        taburKonfeti();
        if (!d.bunyi) bunyikanFanfare();
      }
    }

    /* Biasanya fanfare-nya sudah dibunyikan di halaman permainan tepat
       sebelum pindah ke sini (penanda d.bunyi), jadi tidak diulang.
       Kalau halaman ini dibuka sendiri — misalnya dimuat ulang —
       fanfare dicoba di sini. Peramban boleh menolaknya karena
       halamannya belum disentuh; kalau ditolak, dicoba lagi pada
       sentuhan pertama. */
    function bunyikanFanfare() {
      if (typeof Suara === "undefined") return;
      const a = Suara.mainkan("juara");
      if (!a) return;
      /* Berhasil atau tidaknya dipantau lewat kejadian "playing", bukan
         lewat properti paused: berkasnya sering belum selesai dimuat
         saat play() dipanggil, jadi paused masih true walau sebenarnya
         diizinkan. Kalau setelah 1,5 detik belum berbunyi, berarti
         ditolak — dicoba lagi pada sentuhan pertama. */
      let berbunyi = false;
      const tandai = function () { berbunyi = true; };
      a.addEventListener("playing", tandai, { once: true });
      setTimeout(function () {
        a.removeEventListener("playing", tandai);
        if (berbunyi) return;
        const coba = function () { Suara.mainkan("juara"); };
        window.addEventListener("pointerdown", coba, { once: true, passive: true });
        window.addEventListener("keydown", coba, { once: true });
      }, 1500);
    }

    /* Konfeti sederhana: beberapa kepingan yang jatuh sambil berputar.
       Dimatikan kalau pengguna memilih "kurangi gerakan" di sistemnya. */
    function taburKonfeti() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const wadah = document.getElementById("konfeti");
      const warna = ["#ffd54f", "#ff8a65", "#81c784", "#4fc3f7", "#ba68c8", "#fff176"];
      for (let i = 0; i < 34; i++) {
        const k = document.createElement("i");
        k.style.left = Math.random() * 100 + "vw";
        k.style.background = warna[i % warna.length];
        k.style.animationDelay = (Math.random() * 2.2).toFixed(2) + "s";
        k.style.animationDuration = (3.4 + Math.random() * 2.4).toFixed(2) + "s";
        k.style.transform = "rotate(" + Math.round(Math.random() * 360) + "deg)";
        wadah.appendChild(k);
      }
    }

    render();
    window.addEventListener("hashchange", function () {
      document.getElementById("konfeti").innerHTML = "";
      render();
    });
  </script>
</body>
</html>
